<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Calificaciones</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <main>

        <h1>Registro de Calificaciones</h1>

        <form id="formulario">

            <label for="nombre">Nombre del alumno</label>
            <input
                type="text"
                id="nombre"
                placeholder="Escribe el nombre"
                required
            >

            <label for="negocioselectronicosI">Negocios electronicos I</label>
            <input
                type="number"
                id="negocioselectronicosI"
                min="0"
                max="10"
                step="0.1"
                placeholder="Calificación de Negocios Electronicos I"
                required
            >

            <label for="sistemasoperativosII">Sistemas Operativos II</label>
            <input
                type="number"
                id="sistemasoperativosII"
                min="0"
                max="10"
                step="0.1"
                placeholder="Calificación de Sistemas Operativos II"
                required
            >

            <label for="redesemergentes">Redes Emergentes</label>
            <input
                type="number"
                id="redesemergentes"
                min="0"
                max="10"
                step="0.1"
                placeholder="Calificación de Redes Emergentes"
                required
            >

            <button type="submit">
                Registrar alumno
            </button>

        </form>

        <h2>Alumnos registrados</h2>

        <div id="lista"></div>

    </main>

    <script src="calificaciones.js"></script>

</body>

</html>
